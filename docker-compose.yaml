services:
  coylejax:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: coylejax-backend
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - .env:/app/.env
      - node_modules_data:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped

volumes:
  node_modules_data:
