rules:
  - id: hardcoded-password
    category: Credentials
    title: Hardcoded Password
    severity: CRITICAL
    keywords:
      - password
      - passwd
      - pwd
    regex: (?i)(?P<key>password|passwd|pwd)\s*(=|:)\s*["'](?P<secret>[^"']+)["']
    secret-group-name: secret

  - id: hardcoded-database-username
    category: Credentials
    title: Hardcoded Database Username
    severity: HIGH
    keywords:
      - db_username
      - db_user
      - database_username
      - database_user
    regex: (?i)(?P<key>db_username|db_user|database_username|database_user)\s*(=|:)\s*["']?(?P<secret>[^"',\s]+)["']?
    secret-group-name: secret

  - id: hardcoded-api-key
    category: Credentials
    title: Hardcoded API Key
    severity: CRITICAL
    keywords:
      - api_key
      - apikey
      - api_secret
    regex: (?i)(?P<key>api_key|apikey|api_secret)\s*(=|:)\s*["'](?P<secret>[^"']+)["']
    secret-group-name: secret

  - id: hardcoded-secret-key
    category: Credentials
    title: Hardcoded Secret Key
    severity: CRITICAL
    keywords:
      - secret_key
      - secret
    regex: (?i)(?P<key>secret_key|secret)\s*(=|:)\s*["'](?P<secret>[^"']+)["']
    secret-group-name: secret